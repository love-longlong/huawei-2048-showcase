<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #faf8ef;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; touch-action: none; user-select: none;
}
h1 { color: #776e65; font-size: 2.2rem; margin-bottom: 0.3rem; }
.info { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center; }
.score-box {
  background: #bbada0; color: #fff; border-radius: 6px;
  padding: 0.4rem 1rem; text-align: center; min-width: 80px;
}
.score-box .label { font-size: 0.7rem; text-transform: uppercase; opacity: 0.7; }
.score-box .value { font-size: 1.3rem; font-weight: bold; }
#newGame {
  background: #8f7a66; color: #fff; border: none; border-radius: 6px;
  padding: 0.5rem 1.2rem; font-size: 1rem; cursor: pointer; font-weight: bold;
}
#newGame:hover { background: #7a6555; }
.board {
  background: #bbada0; border-radius: 8px; padding: 10px;
  position: relative; display: grid;
  grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  gap: 10px; width: 340px; height: 340px;
}
.cell {
  background: #cdc1b4; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; font-weight: bold; transition: all 0.1s ease;
}
.tile-2    { background: #eee4da; color: #776e65; }
.tile-4    { background: #ede0c8; color: #776e65; }
.tile-8    { background: #f2b179; color: #f9f6f2; }
.tile-16   { background: #f59563; color: #f9f6f2; }
.tile-32   { background: #f67c5f; color: #f9f6f2; }
.tile-64   { background: #f65e3b; color: #f9f6f2; }
.tile-128  { background: #edcf72; color: #f9f6f2; font-size: 1.5rem; }
.tile-256  { background: #edcc61; color: #f9f6f2; font-size: 1.5rem; }
.tile-512  { background: #edc850; color: #f9f6f2; font-size: 1.5rem; }
.tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.2rem; }
.tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 1.2rem; }
.overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(238, 228, 218, 0.73); border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 10; display: none;
}
.overlay.show { display: flex; }
.overlay h2 { color: #776e65; font-size: 2rem; margin-bottom: 1rem; }
.overlay button {
  background: #8f7a66; color: #fff; border: none; border-radius: 6px;
  padding: 0.6rem 1.5rem; font-size: 1.1rem; cursor: pointer; font-weight: bold;
}
.overlay button:hover { background: #7a6555; }
.hint { color: #776e65; opacity: 0.6; font-size: 0.85rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="info">
  <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
  <div class="score-box"><div class="label">Best</div><div class="value" id="best">0</div></div>
  <button id="newGame">New Game</button>
</div>
<div class="board" id="board">
  <div class="overlay" id="overlay">
    <h2 id="overlayText">Game Over!</h2>
    <button id="overlayBtn">Try Again</button>
  </div>
</div>
<p class="hint">方向键 / WASD / 触屏滑动操作</p>

<script>
(function() {
  const SIZE = 4;
  let grid, score, best, won, over;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlayEl = document.getElementById('overlay');
  const overlayTextEl = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');

  best = parseInt(localStorage.getItem('best2048') || '0', 10);

  function init() {
    grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    score = 0; won = false; over = false;
    addRandom(); addRandom();
    render();
  }

  function addRandom() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    // Remove old cells (keep overlay)
    boardEl.querySelectorAll('.cell').forEach(el => el.remove());
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        const cell = document.createElement('div');
        cell.className = 'cell' + (v > 0 ? ' tile-' + v : '');
        cell.textContent = v > 0 ? v : '';
        boardEl.appendChild(cell);
      }
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
    if (over || won) {
      overlayEl.classList.add('show');
      overlayTextEl.textContent = over ? 'Game Over!' : 'You Win! 🎉';
      overlayBtn.textContent = over ? 'Try Again' : 'Keep Going';
    } else {
      overlayEl.classList.remove('show');
    }
  }

  function slide(row) {
    // Remove zeros, merge, pad
    let arr = row.filter(v => v !== 0);
    let gained = 0;
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        gained += arr[i];
        arr.splice(i + 1, 1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return { row: arr, gained };
  }

  function rotate(g) {
    // Rotate clockwise
    const n = g.length;
    const res = Array.from({length: n}, () => Array(n).fill(0));
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        res[c][n - 1 - r] = g[r][c];
    return res;
  }

  function move(dir) {
    if (over) return;
    // dir: 0=left, 1=up, 2=right, 3=down
    // Normalize: rotate so we always slide left, then rotate back
    let g = grid.map(r => r.slice());
    let rotations = (4 - dir) % 4;
    for (let i = 0; i < rotations; i++) g = rotate(g);

    let moved = false, gained = 0;
    for (let r = 0; r < SIZE; r++) {
      const res = slide(g[r]);
      if (res.row.join(',') !== g[r].join(',')) moved = true;
      g[r] = res.row;
      gained += res.gained;
    }

    // Rotate back
    for (let i = 0; i < (4 - rotations) % 4; i++) g = rotate(g);

    if (!moved) return;
    grid = g;
    score += gained;
    if (score > best) { best = score; localStorage.setItem('best2048', best); }
    addRandom();

    // Check win
    if (!won) {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c] === 2048) { won = true; break; }
    }
    // Check game over
    if (!canMove()) over = true;
    render();
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return true;
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
      }
    return false;
  }

  // Keyboard
  document.addEventListener('keydown', function(e) {
    const map = {
      ArrowLeft: 0, 'a': 0, 'A': 0,
      ArrowUp: 1, 'w': 1, 'W': 1,
      ArrowRight: 2, 'd': 2, 'D': 2,
      ArrowDown: 3, 's': 3, 'S': 3,
    };
    if (e.key in map) { e.preventDefault(); move(map[e.key]); }
  });

  // Touch
  let touchStartX = 0, touchStartY = 0;
  boardEl.addEventListener('touchstart', function(e) {
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, { passive: true });
  boardEl.addEventListener('touchend', function(e) {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 30) return;
    if (absX > absY) move(dx > 0 ? 2 : 0);
    else move(dy > 0 ? 3 : 1);
  }, { passive: true });

  // Buttons
  document.getElementById('newGame').addEventListener('click', init);
  overlayBtn.addEventListener('click', function() {
    if (won && !over) { won = false; overlayEl.classList.remove('show'); }
    else init();
  });

  init();
})();
</script>
</body>
</html>
